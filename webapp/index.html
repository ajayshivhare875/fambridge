<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FamBridge Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1419; --card:#1a222d; --text:#f2f5f8; --sub:#8b98a9;
    --accent:#2f9fe0; --green:#34c77b; --yellow:#e8a33d; --red:#e5484d;
    --line:rgba(139,152,169,.16); --input:#232f3e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    padding:20px 16px 110px; min-height:100vh; font-size:15px; line-height:1.45;
  }
  /* ---------- pages ---------- */
  .page{display:none}
  .page.on{display:block;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* ---------- header ---------- */
  .hello{font-size:13px;color:var(--sub);margin-bottom:2px}
  .title{font-size:26px;font-weight:800;letter-spacing:-.4px;margin-bottom:18px}
  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px;margin-bottom:12px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  .stat .k{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.2px}
  .stat .v{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:6px;font-variant-numeric:tabular-nums}
  .v.green{color:var(--green)} .v.amber{color:var(--yellow)}
  .rowline{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .rowline:last-child{border-bottom:none}
  .rowline .k{color:var(--sub);font-size:14px}
  .rowline .val{font-weight:700;font-size:14px}
  .planbadge{font-size:12px;font-weight:700;color:var(--accent);background:rgba(47,159,224,.12);
    padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.6px}
  .bar{height:8px;background:var(--input);border-radius:5px;overflow:hidden;margin:12px 0 8px}
  .bar>div{height:100%;background:var(--accent);border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .fine{font-size:12.5px;color:var(--sub)}
  .fine b{color:var(--text);font-weight:600}
  .valid{color:var(--green);font-weight:600}
  /* ---------- key ---------- */
  .keyrow{display:flex;align-items:center;gap:10px}
  .keyval{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    background:var(--input);border-radius:12px;padding:11px 12px;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cbtn{background:var(--accent);border:none;color:#fff;font-weight:700;font-size:13.5px;
    border-radius:12px;padding:11px 18px;cursor:pointer;flex-shrink:0}
  .cbtn:active{opacity:.75}
  /* ---------- inputs / buttons ---------- */
  .fld{margin-bottom:4px}
  .inp{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);
    border-radius:13px;padding:13px 14px;font-size:15px;margin-top:10px;outline:none;font-family:inherit}
  .inp:focus{border-color:var(--accent)}
  .inp::placeholder{color:var(--sub);opacity:.7}
  .btn{width:100%;background:var(--accent);border:none;color:#fff;border-radius:14px;
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;font-family:inherit}
  .btn:active{opacity:.8}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
  .btn.danger{background:rgba(229,72,77,.12);color:var(--red);border:1px solid rgba(229,72,77,.3)}
  .msg{font-size:13px;margin-top:10px;min-height:20px}
  .msg.ok{color:var(--green)} .msg.bad{color:var(--red)}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
  .sect{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;
    letter-spacing:1px;margin:22px 2px 10px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
  .dot.ok{background:var(--green)} .dot.no{background:var(--red)}
  /* ---------- orders ---------- */
  .chips{display:flex;gap:8px;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--sub);
    border-radius:20px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .ord{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ord .a{font-size:18px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .ord .m{font-size:12px;color:var(--sub);margin-top:3px}
  .st{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
    padding:6px 12px;border-radius:20px;flex-shrink:0}
  .st.paid{color:var(--green);background:rgba(52,199,123,.12)}
  .st.pending{color:var(--yellow);background:rgba(232,163,61,.12)}
  .st.expired{color:var(--sub);background:rgba(139,152,169,.12)}
  .empty{text-align:center;color:var(--sub);padding:44px 20px;font-size:14px}
  /* ---------- tabbar ---------- */
  #tabbar{position:fixed;left:16px;right:16px;bottom:14px;z-index:50;
    display:flex;background:rgba(26,34,45,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:22px;padding:8px;
    box-shadow:0 10px 34px rgba(0,0,0,.45)}
  .tab{flex:1;border:none;background:transparent;color:var(--sub);font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 0;border-radius:15px;cursor:pointer;font-size:11px;font-weight:600}
  .tab .ti{font-size:19px;line-height:1}
  .tab.on{background:rgba(47,159,224,.14);color:var(--accent)}
  /* ---------- misc ---------- */
  .loader{text-align:center;padding:70px 20px;color:var(--sub)}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .errbox{text-align:center;padding:50px 24px}
  .errbox .et{color:var(--red);font-weight:700;font-size:16px;margin-bottom:8px}
  .errbox .es{color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div id="app"><div class="loader"><div class="spin"></div>Loading…</div></div>
<nav id="tabbar" hidden>
  <button class="tab on" data-p="home"><span class="ti">◈</span><span>Home</span></button>
  <button class="tab" data-p="orders"><span class="ti">▤</span><span>Orders</span></button>
  <button class="tab" data-p="controls"><span class="ti">⚙</span><span>Controls</span></button>
</nav>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if(tg){
    tg.ready(); tg.expand();
    try{
      var sp = tg.themeParams || {}, r = document.documentElement.style;
      if(sp.bg_color) r.setProperty('--bg', sp.bg_color);
      if(sp.secondary_bg_color){ r.setProperty('--card', sp.secondary_bg_color); }
      if(sp.text_color) r.setProperty('--text', sp.text_color);
      if(sp.hint_color) r.setProperty('--sub', sp.hint_color);
      if(sp.button_color) r.setProperty('--accent', sp.button_color);
      tg.setHeaderColor(sp.bg_color || '#0f1419');
      tg.setBackgroundColor(sp.bg_color || '#0f1419');
    }catch(e){}
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
    function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(p){ return 'Rs.' + (p/100).toFixed(2).replace(/\.00$/,''); }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } }
  function fmtDT(s){ return esc((s||'').slice(0,16).replace('T',' ')); }
  function countUp(el, target, isMoney){
    var t0 = null, dur = 700;
    function step(t){
      if(!t0) t0 = t;
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      var v = Math.round(target * e);
      el.textContent = isMoney ? money(v) : v.toLocaleString('en-IN');
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var initData = (tg && tg.initData) || '';
  var D = null, orderFilter = 'all';

  /* ---------- tabs ---------- */
  function showPage(name){
    var ps = document.querySelectorAll('.page');
    for(var i=0;i<ps.length;i++) ps[i].classList.toggle('on', ps[i].id === 'page-' + name);
    var ts = document.querySelectorAll('.tab');
    for(var j=0;j<ts.length;j++) ts[j].classList.toggle('on', ts[j].dataset.p === name);
    window.scrollTo(0,0);
    if(tg && tg.HapticFeedback) try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
  }
  document.getElementById('tabbar').addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if(b) showPage(b.dataset.p);
  });

  /* ---------- controls ---------- */
  function ctl(path, body, msgId, okText){
    var me = document.getElementById(msgId);
    me.className = 'msg'; me.textContent = 'Saving…';
    fetch('/webapp' + path, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({initData: initData}, body))})
    .then(function(r){ return r.json(); }).then(function(d){
      if(d.ok){ me.className = 'msg ok'; me.textContent = okText || 'Saved.'; }
      else { me.className = 'msg bad'; me.textContent = d.error || 'Failed.'; }
    }).catch(function(){ me.className = 'msg bad'; me.textContent = 'Network error.'; });
  }
  window.saveUpi = function(){ ctl('/api/set_upi', {upi_id: document.getElementById('upi_inp').value}, 'upi_msg', 'UPI ID saved.'); };
  window.connectGmail = function(){ ctl('/api/connect_gmail', {email: document.getElementById('gmail_email').value, app_password: document.getElementById('gmail_pass').value}, 'gmail_msg', 'Gmail connected.'); };
  window.disconnectGmail = function(){ ctl('/api/disconnect_gmail', {}, 'gmail_msg', 'Gmail disconnected.'); };
  window.saveWebhook = function(){ ctl('/api/set_webhook', {url: document.getElementById('wh_inp').value}, 'wh_msg', 'Webhook saved.'); };
  window.copyKey = function(){
    var k = document.getElementById('apikey').textContent;
    if(navigator.clipboard) navigator.clipboard.writeText(k);
    var m = document.getElementById('key_msg'); m.className = 'msg ok'; m.textContent = 'Copied to clipboard.';
    setTimeout(function(){ m.textContent = ''; }, 1600);
  };
  window.regenKey = function(){
    if(!window.confirm('Generate a new API key? The current key will stop working immediately.')) return;
    var me = document.getElementById('key_msg');
    me.className = 'msg'; me.textContent = 'Working…';
    fetch('/webapp/api/regen_key', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({initData: initData})}).then(function(r){ return r.json(); }).then(function(d){
      if(d.ok){ document.getElementById('apikey').textContent = d.api_key;
        me.className = 'msg ok'; me.textContent = 'New key generated.'; }
      else { me.className = 'msg bad'; me.textContent = d.error || 'Failed.'; }
    }).catch(function(){ me.className = 'msg bad'; me.textContent = 'Network error.'; });
  };
  window.setFilter = function(f){
    orderFilter = f; renderOrders();
    var cs = document.querySelectorAll('.chip');
    for(var i=0;i<cs.length;i++) cs[i].classList.toggle('on', cs[i].dataset.f === f);
  };

  /* ---------- render ---------- */
  function orderRow(o){
    var cls = o.status === 'paid' ? 'paid' : (o.status === 'pending' ? 'pending' : 'expired');
    return '<div class="ord"><div><div class="a">' + money(o.amount_paise) + '</div>' +
      '<div class="m">' + esc(o.order_id) + ' · ' + fmtDT(o.created_at) +
      (o.note ? ' · ' + esc(String(o.note).slice(0,28)) : '') + '</div></div>' +
      '<span class="st ' + cls + '">' + esc(o.status) + '</span></div>';
  }
  function renderOrders(){
    var list = (D.orders || []).filter(function(o){
      return orderFilter === 'all' || o.status === orderFilter;
    });
    document.getElementById('orderlist').innerHTML = list.length ? list.map(orderRow).join('') :
      '<div class="empty">No ' + (orderFilter === 'all' ? '' : orderFilter + ' ') + 'orders.</div>';
  }
  window.renderOrders = renderOrders;

  function render(d){
    D = d;
    var pct = d.quota_total ? Math.min(100, Math.round(d.quota_used / d.quota_total * 100)) : 0;
    var first = esc((d.owner_name || 'Merchant').split(' ')[0]);
    var app = document.getElementById('app');

    var home =
    '<section class="page on" id="page-home">' +
      '<div class="hello">Welcome back,</div><div class="title">' + first + '</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="k">Total orders</div><div class="v" id="st_total">0</div></div>' +
        '<div class="stat"><div class="k">Revenue</div><div class="v green" id="st_rev">Rs.0</div></div>' +
        '<div class="stat"><div class="k">Paid</div><div class="v green" id="st_paid">0</div></div>' +
        '<div class="stat"><div class="k">Pending</div><div class="v amber" id="st_pend">0</div></div>' +
      '</div>' +
      '<div class="card"><div class="rowline"><span class="k">Current plan</span>' +
        '<span class="planbadge">' + esc(d.plan) + '</span></div>' +
        '<div class="bar"><div id="qbar" style="width:0%"></div></div>' +
        '<div class="fine"><b>' + d.quota_used + '</b> of ' + d.quota_total + ' requests used' +
        (d.plan !== 'free' && d.plan_expires_at ?
          ' · <span class="valid">Valid till ' + fmtDate(d.plan_expires_at) + '</span>' :
          ' · resets 1st') + '</div></div>' +
      '<div class="card"><div class="rowline"><span class="k">API key</span></div>' +
        '<div class="keyrow" style="margin-top:4px"><div class="keyval" id="apikey">' + esc(d.api_key || '') + '</div>' +
        '<button class="cbtn" onclick="copyKey()">Copy</button></div>' +
        '<div class="msg" id="key_msg"></div>' +
        '<div class="rowline" style="margin-top:6px"><span class="k"><span class="dot ' + (d.gmail_ok ? 'ok' : 'no') + '"></span>Gmail</span>' +
        '<span class="val">' + (d.gmail_ok ? 'Connected' : 'Not connected') + '</span></div>' +
        '<div class="rowline"><span class="k"><span class="dot ' + (d.upi_ok ? 'ok' : 'no') + '"></span>UPI ID</span>' +
        '<span class="val">' + (d.upi_ok ? esc(d.upi_id) : 'Not set') + '</span></div></div>' +
    '</section>';

    var orders =
    '<section class="page" id="page-orders">' +
      '<div class="hello">Payment history</div><div class="title">Orders</div>' +
      '<div class="chips">' +
        '<button class="chip on" data-f="all" onclick="setFilter(\'all\')">All</button>' +
        '<button class="chip" data-f="pending" onclick="setFilter(\'pending\')">Pending</button>' +
        '<button class="chip" data-f="paid" onclick="setFilter(\'paid\')">Paid</button>' +
      '</div>' +
      '<div id="orderlist"></div>' +
    '</section>';

    var controls =
    '<section class="page" id="page-controls">' +
      '<div class="hello">Merchant settings</div><div class="title">Controls</div>' +
      '<div class="sect">Payouts</div>' +
      '<div class="card"><div class="fld" style="font-weight:700">UPI ID</div>' +
        '<div class="fine">FamPay UPI ID where customers pay you.</div>' +
        '<input class="inp" id="upi_inp" placeholder="name@fam" autocomplete="off" value="' + esc(d.upi_id || '') + '">' +
        '<button class="btn" onclick="saveUpi()">Save UPI ID</button><div class="msg" id="upi_msg"></div></div>' +
      '<div class="sect">Gmail</div>' +
      '<div class="card"><div class="fld" style="font-weight:700">Payment verification</div>' +
        '<div class="fine">Connect the Gmail linked to your FamPay account. We read payment emails to auto-verify orders.</div>' +
        (d.gmail_ok ?
          '<div class="fine" style="margin-top:10px"><span class="dot ok"></span>' + esc(d.gmail || '') + '</div>' +
          '<button class="btn danger" onclick="disconnectGmail()">Disconnect Gmail</button>' :
          '<input class="inp" id="gmail_email" placeholder="you@gmail.com" autocomplete="off" value="' + esc(d.gmail || '') + '">' +
          '<input class="inp" id="gmail_pass" type="password" placeholder="App Password" autocomplete="off">' +
          '<div class="hint">Google Account → Security → 2-Step Verification → App passwords</div>' +
          '<button class="btn" onclick="connectGmail()">Connect Gmail</button>') +
        '<div class="msg" id="gmail_msg"></div></div>' +
      '<div class="sect">Developer</div>' +
      '<div class="card"><div class="fld" style="font-weight:700">Webhook URL</div>' +
        '<div class="fine">We POST here on every verified payment. Send “off” to disable.</div>' +
        '<input class="inp" id="wh_inp" placeholder="https://…" autocomplete="off" value="' + esc(d.webhook_url || '') + '">' +
        '<button class="btn" onclick="saveWebhook()">Save Webhook</button><div class="msg" id="wh_msg"></div></div>' +
      '<div class="card"><div class="fld" style="font-weight:700">API key</div>' +
        '<div class="fine">Regenerating invalidates the current key immediately.</div>' +
        '<button class="btn danger" onclick="regenKey()">Regenerate Key</button></div>' +
    '</section>';

    app.innerHTML = home + orders + controls;
    document.getElementById('tabbar').hidden = false;
    renderOrders();
    countUp(document.getElementById('st_total'), d.total_orders || 0, false);
    countUp(document.getElementById('st_rev'), d.revenue_paise || 0, true);
    countUp(document.getElementById('st_paid'), d.paid_count || 0, false);
    countUp(document.getElementById('st_pend'), d.pending_count || 0, false);
    setTimeout(function(){ document.getElementById('qbar').style.width = pct + '%'; }, 120);
  }

  /* ---------- boot ---------- */
  fetch('/webapp/api/dashboard', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({initData: initData})})
  .then(function(r){ return r.json(); }).then(function(d){
    if(!d.ok){
      document.getElementById('app').innerHTML =
        '<div class="errbox"><div class="et">Couldn’t load dashboard</div>' +
        '<div class="es">' + esc(d.error || 'Auth failed') + '<br>Open this page from the bot’s Dashboard button.</div></div>';
      return;
    }
    render(d);
  }).catch(function(){
    document.getElementById('app').innerHTML =
      '<div class="errbox"><div class="et">Network error</div>' +
      '<div class="es">Check your connection and reopen.</div></div>';
  });
})();
</script>
</body>
</html>
